databases:
  - name: scicomm-db
    plan: free
    databaseName: scicomm
    user: scicomm

services:
  - type: web
    name: scicomm-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scicomm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: SEED_ADMIN_PASSWORD
        sync: false
